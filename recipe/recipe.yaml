schema_version: 1

context:
  name: lammps-interface
  version: "0.2.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/lammps-interface-${{ version }}.tar.gz
  sha256: e8c34f7d8e3cf73d15aa1aaddff246fdf036831a31eb158dc420200ebfbcdeb0

build:
  number: 2
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    entry_points:
      - lammps-interface = lammps_interface.cli:main

requirements:
  host:
    - pip
    - python ${{ python_min }}.*
    - setuptools
  run:
    - ase
    - networkx >=2.4
    - numpy
    - python >=${{ python_min }}
    - scipy

tests:
  - python:
      imports:
        - lammps_interface
      pip_check: true
      python_version:
        - ${{ python_min }}
        - "*"
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - lammps-interface --help

about:
  license: MIT
  license_file: LICENSE
  summary: Automatic generation of LAMMPS input files for molecular dynamics simulations of MOFs
  description: |
    automatic generation of LAMMPS input files for molecular dynamics
    simulations of MOFs
  homepage: https://github.com/peteboyd/lammps_interface
  repository: https://github.com/peteboyd/lammps_interface
  documentation: https://github.com/peteboyd/lammps_interface

extra:
  recipe-maintainers:
    - jan-janssen
